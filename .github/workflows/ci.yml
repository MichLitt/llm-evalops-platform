name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run unit and integration tests
        run: uv run pytest -q

      - name: Smoke service composition
        run: |
          uv run python -c "from llm_evalops_platform.app import create_app; assert create_app().title"
          uv run python -c "from llm_evalops_platform.worker.normalizer import process_one; assert callable(process_one)"
